<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YHK Pro Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6 flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-slate-200">
        <h1 class="text-2xl font-bold mb-6 text-slate-800">YHK Pro Controller</h1>
        
        <button id="connectBtn" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold mb-4 shadow-lg hover:bg-blue-700 transition-all">1. Connect Printer</button>
        
        <div class="mb-4">
            <input type="file" id="imageInput" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-600 mb-2">Darkness Threshold: <span id="threshVal">128</span></label>
            <input type="range" id="thresholdSlider" min="0" max="255" value="128" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
        </div>

        <div class="mb-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Print Title</label>
                <input type="text" id="titleInput" placeholder="Enter print title..." class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="flex items-center justify-between">
                <span class="text-sm font-medium text-slate-600">Include Timestamp</span>
                <input type="checkbox" id="timeToggle" class="w-5 h-5 accent-blue-600">
            </div>
        </div>

        <div class="mb-6">
            <p class="text-xs font-bold text-slate-400 uppercase mb-2">Live Print Preview</p>
            <div id="previewContainer" class="w-full bg-slate-100 rounded-xl overflow-hidden border border-slate-200 flex justify-center p-4">
                <canvas id="previewCanvas"></canvas>
            </div>
        </div>

        <button id="printBtn" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold mb-6 hover:bg-green-700 transition-all disabled:bg-slate-300" disabled>2. Print Image</button>
        
        <div id="status" class="p-4 bg-slate-100 rounded-xl text-xs text-slate-600 font-mono italic min-h-[4rem]">
            Status: Waiting for connection...
        </div>
    </div>

    <script>
        let characteristic;
        const SERVICE_UUID = '49535343-fe7d-4ae5-8fa9-9fafd205e455';
        const CHAR_UUID = '49535343-8841-43f4-a8d4-ecbe34729bb3';

        const status = document.getElementById('status');
        const connectBtn = document.getElementById('connectBtn');
        const printBtn = document.getElementById('printBtn');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const threshVal = document.getElementById('threshVal');
        const previewCanvas = document.getElementById('previewCanvas');
        const imageInput = document.getElementById('imageInput');
        const titleInput = document.getElementById('titleInput');
        const timeToggle = document.getElementById('timeToggle');

        let sourceImage = new Image();

        const updatePreview = () => {
            threshVal.textContent = thresholdSlider.value;
            if (!sourceImage.src) return;

            const ctx = previewCanvas.getContext('2d');
            const ratio = sourceImage.height / sourceImage.width;
            const targetWidth = 300;
            const targetHeight = Math.floor(targetWidth * ratio) + (titleInput.value ? 40 : 0) + (timeToggle.checked ? 30 : 0);

            previewCanvas.width = targetWidth;
            previewCanvas.height = targetHeight;
            
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, targetWidth, targetHeight);
            
            let yOffset = 0;
            if (titleInput.value) {
                ctx.fillStyle = 'black';
                ctx.font = 'bold 20px sans-serif';
                ctx.fillText(titleInput.value, 10, 25);
                yOffset += 40;
            }
            if (timeToggle.checked) {
                ctx.fillStyle = '#666';
                ctx.font = '12px sans-serif';
                ctx.fillText(new Date().toLocaleString(), 10, yOffset + 10);
                yOffset += 30;
            }

            ctx.drawImage(sourceImage, 0, yOffset, targetWidth, targetWidth * ratio);
            
            const imageData = ctx.getImageData(0, 0, targetWidth, targetHeight);
            const threshold = parseInt(thresholdSlider.value);
            for (let i = 0; i < imageData.data.length; i += 4) {
                const avg = (imageData.data[i] + imageData.data[i+1] + imageData.data[i+2]) / 3;
                const val = avg < threshold ? 0 : 255;
                imageData.data[i] = imageData.data[i+1] = imageData.data[i+2] = val;
            }
            ctx.putImageData(imageData, 0, 0);
        };

        imageInput.onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (event) => {
                sourceImage.src = event.target.result;
                sourceImage.onload = updatePreview;
            };
            reader.readAsDataURL(file);
        };

        [thresholdSlider, titleInput, timeToggle].forEach(el => el.addEventListener('input', updatePreview));

        function updateStatus(msg) { status.textContent = "Status: " + msg; }

        connectBtn.onclick = async () => {
            try {
                updateStatus("Requesting device...");
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{namePrefix: 'YHK'}],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                characteristic = await service.getCharacteristic(CHAR_UUID);
                updateStatus("Connected! Ready to print.");
                printBtn.disabled = false;
            } catch (e) { updateStatus("Error: " + e.message); }
        };

        printBtn.onclick = async () => {
            updateStatus("Processing and streaming...");
            const ctx = previewCanvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, previewCanvas.width, previewCanvas.height);
            const width = 384;
            const height = Math.floor(previewCanvas.height * (384 / previewCanvas.width));
            
            const bitmap = new Uint8Array(Math.floor(height * (width / 8)));
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const i = (Math.floor(y * (previewCanvas.height / height)) * previewCanvas.width + Math.floor(x * (previewCanvas.width / width))) * 4;
                    if (imageData.data[i] < 128) {
                        bitmap[y * (width / 8) + Math.floor(x / 8)] |= (1 << (7 - (x % 8)));
                    }
                }
            }

            const header = new Uint8Array([0x1D, 0x76, 0x30, 0x00, 48, 0x00, height & 0xFF, (height >> 8) & 0xFF]);
            const finalBuffer = new Uint8Array([...header, ...bitmap, 0x0A, 0x0A, 0x0A]);

            for (let i = 0; i < finalBuffer.length; i += 20) {
                await characteristic.writeValue(finalBuffer.slice(i, i + 20));
                await new Promise(r => setTimeout(r, 10));
            }
            updateStatus("Print complete!");
        };
    </script>
</body>
</html>
