<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Bluetooth Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6 flex items-center justify-center min-h-screen">
    <div class="max-w-sm w-full bg-white p-8 rounded-3xl shadow-lg border border-slate-200">
        <h1 class="text-xl font-bold mb-4">Raw Device Scanner</h1>
        <button id="scanBtn" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold">
            Scan for Devices
        </button>
        <div id="log" class="mt-4 text-xs text-slate-500 italic"></div>
    </div>

    <script>
        document.getElementById('scanBtn').addEventListener('click', async () => {
            const log = document.getElementById('log');
            log.textContent = "Opening device picker...";
            try {
                // Scanning for all devices, no filters
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['49535343-fe7d-4ae5-8fa9-9fafd205e455']
                });
                log.textContent = "Selected: " + device.name;
            } catch (err) {
                log.textContent = "Error: " + err.message;
            }
        });
    </script>
</body>
</html>
