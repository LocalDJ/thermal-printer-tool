<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YHK Image Printer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6 flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-slate-200">
        <h1 class="text-2xl font-bold mb-6 text-slate-800">YHK Printer Controller</h1>
        
        <button id="connectBtn" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold mb-4 shadow-lg hover:bg-blue-700 transition-all">1. Connect Printer</button>
        
        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-600 mb-2">Select Image to Print:</label>
            <input type="file" id="imageInput" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-600 mb-2">Threshold (Darkness): <span id="threshVal">128</span></label>
            <input type="range" id="thresholdSlider" min="0" max="255" value="128" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
        </div>

        <button id="printBtn" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold mb-6 hover:bg-green-700 transition-all disabled:bg-slate-300" disabled>2. Print Image</button>
        
        <div id="status" class="p-4 bg-slate-100 rounded-xl text-xs text-slate-600 font-mono italic min-h-[4rem]">
            Status: Waiting for connection...
        </div>
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <script>
        let characteristic;
        const SERVICE_UUID = '49535343-fe7d-4ae5-8fa9-9fafd205e455';
        const CHAR_UUID = '49535343-8841-43f4-a8d4-ecbe34729bb3';

        const status = document.getElementById('status');
        const connectBtn = document.getElementById('connectBtn');
        const printBtn = document.getElementById('printBtn');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const threshVal = document.getElementById('threshVal');

        thresholdSlider.oninput = () => threshVal.textContent = thresholdSlider.value;
        function updateStatus(msg) { status.textContent = "Status: " + msg; }

        connectBtn.onclick = async () => {
            try {
                updateStatus("Requesting device...");
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{namePrefix: 'YHK'}],
                    optionalServices: [SERVICE_UUID]
                });
                updateStatus("Connecting to GATT...");
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                characteristic = await service.getCharacteristic(CHAR_UUID);
                updateStatus("Connected! Ready to print.");
                printBtn.disabled = false;
            } catch (e) { updateStatus("Error: " + e.message); }
        };

        printBtn.onclick = async () => {
            const fileInput = document.getElementById('imageInput');
            if (!fileInput.files[0]) { updateStatus("Please select an image first!"); return; }

            updateStatus("Processing image...");
            const img = new Image();
            img.src = URL.createObjectURL(fileInput.files[0]);
            await img.decode();

            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 384; 
            canvas.height = Math.floor(img.height * (384 / img.width));
            
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const imageData = ctx.getImageData(0, 0, 384, canvas.height);
            const bytesPerLine = 48;
            const bitmap = new Uint8Array(bytesPerLine * canvas.height);
            const threshold = parseInt(thresholdSlider.value);

            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < 384; x++) {
                    const i = (y * 384 + x) * 4;
                    const brightness = (imageData.data[i] + imageData.data[i+1] + imageData.data[i+2]) / 3;
                    if (brightness < threshold) {
                        bitmap[y * bytesPerLine + Math.floor(x / 8)] |= (1 << (7 - (x % 8)));
                    }
                }
            }

            const header = new Uint8Array([0x1D, 0x76, 0x30, 0x00, 48, 0x00, canvas.height & 0xFF, (canvas.height >> 8) & 0xFF]);
            const finalBuffer = new Uint8Array([...header, ...bitmap, 0x0A, 0x0A, 0x0A]);

            updateStatus("Sending to printer...");
            for (let i = 0; i < finalBuffer.length; i += 20) {
                await characteristic.writeValue(finalBuffer.slice(i, i + 20));
                // Reduced delay from 30ms to 15ms for faster throughput
                await new Promise(r => setTimeout(r, 15));
                updateStatus(`Streaming: ${Math.floor((i/finalBuffer.length)*100)}%`);
            }
            updateStatus("Done! Check your printer.");
        };
    </script>
</body>
</html>
