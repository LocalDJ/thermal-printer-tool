<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YHK Pro Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6 flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-slate-200">
        <h1 class="text-2xl font-bold mb-6 text-slate-800">YHK Pro Controller</h1>
        
        <button id="connectBtn" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold mb-4 shadow-lg hover:bg-blue-700 transition-all">1. Connect Printer</button>
        
        <div class="mb-4">
            <input type="file" id="imageInput" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <div class="mb-4 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-2">Darkness Threshold: <span id="threshVal">128</span></label>
                <input type="range" id="thresholdSlider" min="0" max="255" value="128" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-2">Dithering Mode</label>
                <select id="ditherSelect" class="w-full p-2 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="none">Off (Simple Threshold)</option>
                    <option value="fs">Floyd-Steinberg (Diffusion)</option>
                    <option value="atkinson">Atkinson (High Contrast)</option>
                    <option value="random">Random (Noise Dithering)</option>
                </select>
            </div>
        </div>

        <div class="mb-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Print Title</label>
                <input type="text" id="titleInput" placeholder="Enter print title..." class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="flex items-center justify-between">
                <span class="text-sm font-medium text-slate-600">Include Timestamp</span>
                <input type="checkbox" id="timeToggle" class="w-5 h-5 accent-blue-600">
            </div>
        </div>

        <div class="mb-6">
            <p class="text-xs font-bold text-slate-400 uppercase mb-2">Live Print Preview</p>
            <div id="previewContainer" class="w-full bg-slate-100 rounded-xl overflow-hidden border border-slate-200 flex justify-center p-4">
                <canvas id="previewCanvas"></canvas>
            </div>
        </div>

        <button id="printBtn" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold mb-6 hover:bg-green-700 transition-all disabled:bg-slate-300" disabled>2. Print Image</button>
        
        <div id="status" class="p-4 bg-slate-100 rounded-xl text-xs text-slate-600 font-mono italic min-h-[4rem]">
            Status: Waiting for connection...
        </div>
    </div>

    <script>
        let characteristic;
        const SERVICE_UUID = '49535343-fe7d-4ae5-8fa9-9fafd205e455';
        const CHAR_UUID = '49535343-8841-43f4-a8d4-ecbe34729bb3';

        const status = document.getElementById('status');
        const connectBtn = document.getElementById('connectBtn');
        const printBtn = document.getElementById('printBtn');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const threshVal = document.getElementById('threshVal');
        const ditherSelect = document.getElementById('ditherSelect');
        const previewCanvas = document.getElementById('previewCanvas');
        const imageInput = document.getElementById('imageInput');
        const titleInput = document.getElementById('titleInput');
        const timeToggle = document.getElementById('timeToggle');

        let sourceImage = new Image();

        function applyDithering(data, width, height, threshold, mode) {
            const output = new Uint8ClampedArray(data);
            if (mode === 'fs') {
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const i = (y * width + x) * 4;
                        const oldP = (output[i] + output[i+1] + output[i+2]) / 3;
                        const newP = oldP < threshold ? 0 : 255;
                        const err = oldP - newP;
                        output[i] = output[i+1] = output[i+2] = newP;
                        if (x + 1 < width) output[(y * width + (x + 1)) * 4] += err * 7 / 16;
                        if (y + 1 < height) {
                            if (x - 1 >= 0) output[((y + 1) * width + (x - 1)) * 4] += err * 3 / 16;
                            output[((y + 1) * width + x) * 4] += err * 5 / 16;
                            if (x + 1 < width) output[((y + 1) * width + (x + 1)) * 4] += err * 1 / 16;
                        }
                    }
                }
            } else if (mode === 'atkinson') {
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const i = (y * width + x) * 4;
                        const oldP = (output[i] + output[i+1] + output[i+2]) / 3;
                        const newP = oldP < threshold ? 0 : 255;
                        const err = (oldP - newP) / 8;
                        output[i] = output[i+1] = output[i+2] = newP;
                        if (x + 1 < width) output[(y * width + (x + 1)) * 4] += err;
                        if (x + 2 < width) output[(y * width + (x + 2)) * 4] += err;
                        if (y + 1 < height) {
                            if (x - 1 >= 0) output[((y + 1) * width + (x - 1)) * 4] += err;
                            output[((y + 1) * width + x) * 4] += err;
                            if (x + 1 < width) output[((y + 1) * width + (x + 1)) * 4] += err;
                        }
                    }
                }
            } else if (mode === 'random') {
                for (let i = 0; i < data.length; i += 4) {
                    const avg = (data[i] + data[i+1] + data[i+2]) / 3;
                    const noise = (Math.random() - 0.5) * 60;
                    const val = (avg + noise) < threshold ? 0 : 255;
                    output[i] = output[i+1] = output[i+2] = val;
                }
            }
            return output;
        }

        const updatePreview = () => {
            threshVal.textContent = thresholdSlider.value;
            if (!sourceImage.src) return;

            const ctx = previewCanvas.getContext('2d');
            const ratio = sourceImage.height / sourceImage.width;
            const targetWidth = 384;
            const yOffset = (titleInput.value ? 40 : 0) + (timeToggle.checked ? 30 : 0);
            const targetHeight = Math.floor(targetWidth * ratio) + yOffset;

            previewCanvas.width = targetWidth;
            previewCanvas.height = targetHeight;
            
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, targetWidth, targetHeight);
            
            ctx.fillStyle = 'black';
            ctx.font = 'bold 20px sans-serif';
            let cursorY = 20;
            if (titleInput.value) { ctx.fillText(titleInput.value, 10, cursorY); cursorY += 30; }
            if (timeToggle.checked) { ctx.font = '12px sans-serif'; ctx.fillText(new Date().toLocaleString(), 10, cursorY); }

            ctx.drawImage(sourceImage, 0, yOffset, targetWidth, targetWidth * ratio);
            
            let imageData = ctx.getImageData(0, yOffset, targetWidth, Math.floor(targetWidth * ratio));
            const threshold = parseInt(thresholdSlider.value);
            const mode = ditherSelect.value;

            if (mode !== 'none') {
                const processed = applyDithering(imageData.data, targetWidth, Math.floor(targetWidth * ratio), threshold, mode);
                imageData.data.set(processed);
            } else {
                for (let i = 0; i < imageData.data.length; i += 4) {
                    const avg = (imageData.data[i] + imageData.data[i+1] + imageData.data[i+2]) / 3;
                    const val = avg < threshold ? 0 : 255;
                    imageData.data[i] = imageData.data[i+1] = imageData.data[i+2] = val;
                }
            }
            
            // Text is forced high contrast
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, targetWidth, yOffset);
            ctx.fillStyle = 'black';
            ctx.font = 'bold 20px sans-serif';
            cursorY = 20;
            if (titleInput.value) { ctx.fillText(titleInput.value, 10, cursorY); cursorY += 30; }
            if (timeToggle.checked) { ctx.font = '12px sans-serif'; ctx.fillText(new Date().toLocaleString(), 10, cursorY); }

            ctx.putImageData(imageData, 0, yOffset);
        };

        imageInput.onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (event) => { sourceImage.src = event.target.result; sourceImage.onload = updatePreview; };
            reader.readAsDataURL(e.target.files[0]);
        };

        [thresholdSlider, titleInput, timeToggle, ditherSelect].forEach(el => el.addEventListener('input', updatePreview));

        function updateStatus(msg) { status.textContent = "Status: " + msg; }

        connectBtn.onclick = async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{namePrefix: 'YHK'}],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                characteristic = await service.getCharacteristic(CHAR_UUID);
                updateStatus("Connected! Ready to print.");
                printBtn.disabled = false;
            } catch (e) { updateStatus("Error: " + e.message); }
        };

        printBtn.onclick = async () => {
            updateStatus("Streaming to printer...");
            const ctx = previewCanvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, previewCanvas.width, previewCanvas.height);
            const w = previewCanvas.width;
            const h = previewCanvas.height;
            const bitmap = new Uint8Array(Math.ceil(h * (w / 8)));
            
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (imageData.data[(y * w + x) * 4] < 128) {
                        bitmap[y * (w / 8) + Math.floor(x / 8)] |= (1 << (7 - (x % 8)));
                    }
                }
            }

            const header = new Uint8Array([0x1D, 0x76, 0x30, 0x00, (w/8) & 0xFF, ((w/8) >> 8) & 0xFF, h & 0xFF, (h >> 8) & 0xFF]);
            const fullPacket = new Uint8Array([...header, ...bitmap, 0x0A, 0x0A, 0x0A]);

            for (let i = 0; i < fullPacket.length; i += 20) {
                await characteristic.writeValue(fullPacket.slice(i, i + 20));
                await new Promise(r => setTimeout(r, 10));
            }
            updateStatus("Print complete!");
        };
    </script>
</body>
</html>
